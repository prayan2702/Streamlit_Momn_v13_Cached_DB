name: Morning Equity List Fetch

on:
  schedule:
    # Roz 3:30 AM UTC = 9:00 AM IST
    - cron: '30 3 * * 1-5'

  # Manual trigger bhi possible
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-equity-list:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Fetch EQUITY_L.csv from NSE
        run: |
          python - <<'EOF'
          import requests, pandas as pd, sys, time
          from io import StringIO

          FALLBACK_URLS = [
              "https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv",
              "https://archives.nseindia.com/content/equities/EQUITY_L.csv",
          ]
          HDR = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "gzip, deflate, br",
              "Connection": "keep-alive",
              "Referer": "https://www.nseindia.com/",
              "sec-ch-ua": '"Chromium";v="124", "Google Chrome";v="124", "Not-A.Brand";v="99"',
              "sec-ch-ua-mobile": "?0",
              "sec-ch-ua-platform": '"Windows"',
              "sec-fetch-dest": "document",
              "sec-fetch-mode": "navigate",
              "sec-fetch-site": "same-site",
              "sec-fetch-user": "?1",
              "Upgrade-Insecure-Requests": "1",
          }

          session = requests.Session()
          for wu in ["https://www.nseindia.com",
                     "https://www.nseindia.com/market-data/securities-available-for-trading"]:
              try:
                  session.get(wu, headers=HDR, timeout=15)
                  time.sleep(0.8)
              except Exception as e:
                  print(f"Warmup warn: {e}")

          last_err = None
          for url in FALLBACK_URLS:
              try:
                  resp = session.get(url, headers=HDR, timeout=30)
                  resp.raise_for_status()
                  df = pd.read_csv(StringIO(resp.text), skipinitialspace=True)
                  df.columns = [c.strip() for c in df.columns]
                  if 'SERIES' in df.columns:
                      df = df[df['SERIES'].str.strip() == 'EQ'].copy()
                  df['SYMBOL'] = df['SYMBOL'].str.strip().str.upper()
                  df = df.reset_index(drop=True)
                  df.to_csv("EQUITY_L.csv", index=False)
                  print(f"✅ Saved EQUITY_L.csv — {len(df):,} EQ stocks from {url}")
                  sys.exit(0)
              except Exception as e:
                  last_err = e
                  print(f"Failed {url}: {e}")
                  time.sleep(1)

          print(f"❌ All URLs failed: {last_err}")
          sys.exit(1)
          EOF

      - name: Commit and push EQUITY_L.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add EQUITY_L.csv
          git diff --staged --quiet || git commit -m "📋 Morning equity list: $(date +'%Y-%m-%d %H:%M UTC')"
          git push
