name: Daily Cache Build — TradingView

# ════════════════════════════════════════════════════════════
# GitHub Actions TradingView cache builder
# Runs daily at 10:00 PM IST (16:30 UTC), Mon-Fri
#
# tvDatafeed: NSE daily data, up to 5000 bars per symbol
# Anonymous mode works (limited) — set TV_USERNAME + TV_PASSWORD
# for better data access.
#
# Required GitHub Secrets (Repo → Settings → Secrets → Actions):
#   PAT_TOKEN (repo write access)
#
# Optional Secrets (for logged-in data):
#   TV_USERNAME | TV_PASSWORD
# ════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "30 16 * * 1-5"   # Mon-Fri 16:30 UTC = 10:00 PM IST
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 360       # 6 hours max — 2100+ symbols × ~0.2s + retries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "git+https://github.com/rongardF/tvdatafeed.git" \
            "pandas" \
            "numpy" \
            "pyarrow" \
            "requests" \
            "python-dateutil"

      - name: Build TradingView cache
        env:
          TV_USERNAME: ${{ secrets.TV_USERNAME }}
          TV_PASSWORD: ${{ secrets.TV_PASSWORD }}
        run: |
          python cache_builder_tradingview.py

      - name: Commit and push cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache_tradingview/
          git diff --cached --quiet || git commit -m "chore: TradingView cache update $(date +'%Y-%m-%d')"
          git push
