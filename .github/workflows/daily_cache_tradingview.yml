name: Daily Cache Build — TradingView

# ════════════════════════════════════════════════════════════
# GitHub Actions TradingView cache builder
# Runs daily at 10:00 PM IST (16:30 UTC), Mon-Fri
#
# tv-scraper (CandleStreamer) — tvDatafeed ki jagah
# Anonymous WebSocket mode works — NSE daily data milta hai
# Optional: TV_COOKIE secret set karo better access ke liye
#
# Required GitHub Secrets (Repo → Settings → Secrets → Actions):
#   PAT_TOKEN   (repo write access — required)
#
# Optional Secrets (for cookie-based auth):
#   TV_COOKIE   (TradingView session cookie — paste full Cookie header)
# ════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "30 16 * * 1-5"   # Mon-Fri 16:30 UTC = 10:00 PM IST
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 360       # 6 hours max — 2100+ symbols × ~1s + retries

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "git+https://github.com/smitkunpara/tv-scraper.git" \
            "pandas" \
            "numpy" \
            "pyarrow" \
            "requests" \
            "python-dateutil" \
            "websocket-client>=1.8.0" \
            "pyjwt>=2.10.1"

      - name: Build TradingView cache
        env:
          TV_COOKIE: ${{ secrets.TV_COOKIE }}
        run: |
          python cache_builder_tradingview.py

      - name: Commit and push cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add cache_tradingview/
          git diff --cached --quiet || git commit -m "chore: TradingView cache update $(date +'%Y-%m-%d')"
          git push
