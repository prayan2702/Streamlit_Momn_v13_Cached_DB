name: Daily Cache Build — Angel One

# ════════════════════════════════════════════════════════════
# GitHub Actions Angel One cache builder
# Runs daily at 9:30 PM IST (4:00 PM UTC)
#
# Static IP Problem — FREE SOLUTION:
#   GitHub Actions ka IP dynamic hota hai (static nahi).
#   Angel One SmartAPI app mein "127.0.0.1" as Primary Static IP enter karo.
#   Historical data endpoint (getCandleData) IP-check enforce nahi karta.
#   Sirf order placement APIs ke liye strict IP whitelisting hoti hai.
#   Data-only apps ke liye 127.0.0.1 placeholder perfectly kaam karta hai.
#
# Required GitHub Secrets (Repo → Settings → Secrets → Actions):
#   ANGELONE_CLIENT_ID    — R/T number (e.g., R1234567)
#   ANGELONE_API_KEY      — SmartAPI app ka API key
#   ANGELONE_PASSWORD     — Angel One login password
#   ANGELONE_TOTP_SECRET  — TOTP secret (smartapi.angelone.in → Enable TOTP)
#   PAT_TOKEN             — GitHub Personal Access Token (write access)
#
# ════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "0 18 * * 1-5"   # Mon-Fri 6:00 PM UTC = 11:30 PM IST
                               # INTENTIONALLY 2hr AFTER Upstox (16:00 UTC, ~82 min run)
                               # Avoids git push conflict on same repo
  workflow_dispatch:           # Manual trigger bhi possible

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 240       # 4 hours — actual run ~215 min (2134 syms × 5.6s) + 25 min buffer

    steps:
      # ── 1. Checkout repo ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      # ── 2. Python setup ────────────────────────────────────
      - name: Setup Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "smartapi-python==1.3.4" \
            logzero \
            pyotp \
            pandas \
            pyarrow \
            numpy \
            requests \
            python-dateutil \
            websocket-client

      # ── 3a. Verify SmartApi import ─────────────────────────
      - name: Verify SmartApi import
        run: python -c "from SmartApi import SmartConnect; import pyotp; print('✅ SmartApi + pyotp OK')"

      # ── 4. Run Angel One cache builder ────────────────────
      - name: Build Angel One cache
        env:
          ANGELONE_CLIENT_ID:   ${{ secrets.ANGELONE_CLIENT_ID }}
          ANGELONE_API_KEY:     ${{ secrets.ANGELONE_API_KEY }}
          ANGELONE_PASSWORD:    ${{ secrets.ANGELONE_PASSWORD }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
        run: |
          echo "=== Starting Angel One Cache Build ==="
          echo "Date: $(date)"
          python cache_builder_angelone.py
          echo "=== Build complete ==="
          ls -lh cache_angelone/ || echo "cache_angelone/ not found"

      # ── 5. Verify output files ─────────────────────────────
      - name: Verify cache files
        run: |
          echo "=== Cache file sizes ==="
          du -sh cache_angelone/*.parquet cache_angelone/cache_meta.json 2>/dev/null || true
          echo "=== Cache meta ==="
          cat cache_angelone/cache_meta.json 2>/dev/null | python -m json.tool | head -30 || true

      # ── 6. Commit & push to repo ───────────────────────────
      - name: Commit cache to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache_angelone/
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "🤖 Auto: Angel One cache update $(date '+%Y-%m-%d %H:%M IST')"
            git pull --rebase origin main
            git push
          )
