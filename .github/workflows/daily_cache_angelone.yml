name: Daily Cache Build — Angel One

# ════════════════════════════════════════════════════════════
# GitHub Actions Angel One cache builder
# Runs daily at 11:30 PM IST (13:00 UTC), 2 hrs after Upstox
#
# Angel One todate = "today+1 15:30" — today's candle guaranteed
#
# Static IP Problem — FREE SOLUTION:
#   GitHub Actions ka IP dynamic hota hai (static nahi).
#   Angel One SmartAPI app mein "127.0.0.1" as Primary Static IP enter karo.
#   Historical data endpoint (getCandleData) IP-check enforce nahi karta.
#
# Required GitHub Secrets (Repo → Settings → Secrets → Actions):
#   ANGELONE_CLIENT_ID | ANGELONE_API_KEY | ANGELONE_PASSWORD
#   ANGELONE_TOTP_SECRET | PAT_TOKEN
# ════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: "0 13 * * 1-5"   # Mon-Fri 13:00 UTC = 6:30 PM IST
                               # 2 hrs after Upstox (15:00 UTC) — avoids push conflict
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 300       # 5 hours — 2134 syms × ~5.6s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            "smartapi-python==1.3.4" \
            logzero \
            pyotp \
            pandas \
            pyarrow \
            numpy \
            requests \
            python-dateutil \
            websocket-client

      - name: Verify SmartApi import
        run: python -c "from SmartApi import SmartConnect; import pyotp; print('✅ SmartApi + pyotp OK')"

      - name: Build Angel One cache
        env:
          ANGELONE_CLIENT_ID:   ${{ secrets.ANGELONE_CLIENT_ID }}
          ANGELONE_API_KEY:     ${{ secrets.ANGELONE_API_KEY }}
          ANGELONE_PASSWORD:    ${{ secrets.ANGELONE_PASSWORD }}
          ANGELONE_TOTP_SECRET: ${{ secrets.ANGELONE_TOTP_SECRET }}
        run: |
          echo "=== Starting Angel One Cache Build ==="
          echo "Date: $(date)"
          python cache_builder_angelone.py
          echo "=== Build complete ==="
          ls -lh cache_angelone/ || echo "cache_angelone/ not found"

      - name: Verify cache files
        run: |
          echo "=== Cache file sizes ==="
          du -sh cache_angelone/*.parquet cache_angelone/cache_meta.json 2>/dev/null || true
          echo "=== Cache meta ==="
          cat cache_angelone/cache_meta.json 2>/dev/null | python -m json.tool | head -30 || true

      # ── Data freshness validation ─────────────────────────
      - name: Verify today's data is present in cache
        run: |
          python - <<'EOF'
          import json, sys
          from datetime import date

          try:
              with open("cache_angelone/cache_meta.json") as f:
                  meta = json.load(f)

              today            = date.today().isoformat()
              last_in_cache    = meta.get("last_date_in_cache", "N/A")
              today_present    = meta.get("today_data_present", False)
              symbols_fetched  = meta.get("symbols_fetched", 0)
              symbols_total    = meta.get("symbols_total", 0)
              last_chunk       = meta.get("last_chunk_todate", "N/A")

              print(f"Build date         : {meta.get('build_date')}")
              print(f"Today              : {today}")
              print(f"Last chunk todate  : {last_chunk}")
              print(f"Last date cached   : {last_in_cache}")
              print(f"Today present      : {'✅ YES' if today_present else '⚠️  NO'}")
              print(f"Symbols            : {symbols_fetched}/{symbols_total} fetched")

              if today_present:
                  print("✅ PASS: Today's closing data is in the cache.")
              else:
                  print(f"⚠️  NOTE: Today ({today}) not in cache.")
                  print(f"   Last available: {last_in_cache}")
                  print("   Expected on market holidays and weekends.")
                  sys.exit(0)
          except Exception as e:
              print(f"Validation check failed: {e}")
              sys.exit(0)
          EOF

      - name: Commit cache to repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache_angelone/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "🤖 Auto: Angel One cache update $(date '+%Y-%m-%d %H:%M IST')"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && echo "✅ Push OK (attempt $attempt)" && exit 0
            echo "⚠️  Push failed (attempt $attempt/5) — retrying in 10s..."
            sleep 10
          done
          echo "❌ Push failed after 5 attempts"
          exit 1
